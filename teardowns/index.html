<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Teardown · Aditya Khanna</title>
  <meta name="description" content="Product teardowns by Aditya Khanna: a point of view, first-hand evidence, an estimate with its assumptions on show, and a bet worth defending.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../assets/css/tokens.css?v=20261122b">
  <link rel="stylesheet" href="../assets/css/main.css?v=20261122b">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <script>try{if(localStorage.getItem('td-redpen')==='1')document.documentElement.classList.add('redpen');}catch(e){}</script>
  <script data-goatcounter="https://adikhanna.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="me" id="back" href="../#principles"><span><b>← Aditya Khanna</b><span>Back to the site</span></span></a>
      <div class="nav-actions" style="margin-left:auto">
        <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch theme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="wrap td-page">
    <div class="td-toolbar">
      <p class="eyebrow" id="eyebrow">Teardown</p>
      <button type="button" class="td-toggle" id="penBtn" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span id="penLabel">Show red pen</span></button>
    </div>
    <article class="td-article" id="td" aria-live="polite"><p>Loading…</p></article>
    <nav class="td-more" id="more" aria-label="More teardowns"></nav>
  </main>

<script>
(function () {
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function filled(v) { return Array.isArray(v) ? v.length > 0 : (v && typeof v === "object") ? Object.keys(v).length > 0 : !!(v != null && String(v).trim()); }
  var root = document.documentElement;

  /* theme */
  var tb = document.getElementById("themeBtn");
  function cur() { return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  tb.addEventListener("click", function () { var n = cur() === "dark" ? "light" : "dark"; root.setAttribute("data-theme", n); try { localStorage.setItem("theme", n); } catch (e) {} });

  /* red pen toggle */
  var pen = document.getElementById("penBtn"), penLabel = document.getElementById("penLabel");
  function syncPen() {
    var on = root.classList.contains("redpen");
    pen.setAttribute("aria-pressed", on ? "true" : "false");
    penLabel.textContent = on ? "Hide red pen" : "Show red pen";
  }
  syncPen();
  pen.addEventListener("click", function () {
    var on = root.classList.toggle("redpen");
    try { localStorage.setItem("td-redpen", on ? "1" : "0"); } catch (e) {}
    syncPen();
  });

  /* render helpers */
  function penNote(p) {
    if (!p || !filled(p.note)) return null;
    var d = el("div", "td-pen");
    if (filled(p.dim)) d.appendChild(el("span", "dim", p.dim));
    d.appendChild(el("span", "txt", p.note));
    return d;
  }
  function blocks(container, arr) {
    (arr || []).forEach(function (b) {
      if (typeof b === "string") { container.appendChild(el("p", null, b)); return; }
      if (b.callout) { container.appendChild(el("p", "td-callout", b.callout)); return; }
      if (b.sub) { container.appendChild(el("p", "td-sub", b.sub)); return; }
      if (b.list) { var ul = el("ul"); b.list.forEach(function (x) { ul.appendChild(el("li", null, x)); }); container.appendChild(ul); return; }
      if (b.num) {
        var ol = el("ol");
        b.num.forEach(function (x) {
          var li = el("li");
          if (x.lead) { li.appendChild(el("b", "td-lead", x.lead + " ")); li.appendChild(document.createTextNode(x.body || "")); }
          else li.textContent = x.body || x;
          ol.appendChild(li);
        });
        container.appendChild(ol); return;
      }
      if (b.table) {
        var t = b.table, tbl = el("table", "td-table");
        var thead = el("thead"), tr = el("tr");
        (t.cols || []).forEach(function (c) { tr.appendChild(el("th", null, c)); });
        thead.appendChild(tr); tbl.appendChild(thead);
        var tbody = el("tbody");
        (t.rows || []).forEach(function (r) {
          var row = el("tr");
          r.forEach(function (cell, i) { var td = el("td", null, cell); if (t.cols && t.cols[i]) td.setAttribute("data-l", t.cols[i]); row.appendChild(td); });
          tbody.appendChild(row);
        });
        tbl.appendChild(tbody); container.appendChild(tbl); return;
      }
    });
  }

  var id = new URLSearchParams(location.search).get("t");
  fetch("../data/teardowns.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (data) {
    var items = (data && data.items) || [];
    var box = document.getElementById("td"), more = document.getElementById("more");
    var c = items.filter(function (x) { return x.id === id; })[0];
    box.innerHTML = "";
    if (!c) {
      document.getElementById("eyebrow").textContent = "Teardowns";
      box.appendChild(el("h1", null, "Teardowns"));
      box.appendChild(el("p", "td-callout", "Pick one below."));
      pen.style.display = "none";
    } else {
      document.title = c.product + " · Teardown · Aditya Khanna";
      document.getElementById("eyebrow").textContent = c.eyebrow || "Teardown";
      box.appendChild(el("h1", null, (c.product ? c.product + " — " : "") + c.title));

      /* thesis */
      var th = el("p", "td-thesis", c.thesis); box.appendChild(th);
      var tp = penNote(c.thesisPen); if (tp) box.appendChild(tp);

      /* sections */
      (c.sections || []).forEach(function (s) {
        var sec = el("section", "td-sec");
        sec.appendChild(el("h2", null, s.h));
        blocks(sec, s.blocks);
        var p = penNote(s.pen); if (p) sec.appendChild(p);
        box.appendChild(sec);
      });

      /* drop to PM box (red pen only) */
      if (filled(c.dropToPm)) {
        var dp = el("section", "td-sec td-droppm");
        dp.appendChild(el("h2", null, "What would drop this to PM level"));
        dp.appendChild(el("p", "lede", "The weaker version of each part, and why it falls short. Shown with the red pen on."));
        var tbl = el("table", "td-table"), thead = el("thead"), tr = el("tr");
        ["Section", "The weaker version", "Why it's weaker"].forEach(function (h) { tr.appendChild(el("th", null, h)); });
        thead.appendChild(tr); tbl.appendChild(thead);
        var tbody = el("tbody");
        c.dropToPm.forEach(function (r) {
          var row = el("tr");
          var a = el("td", null, r.s); a.setAttribute("data-l", "Section");
          var b = el("td", null, r.weak); b.setAttribute("data-l", "The weaker version");
          var d = el("td", null, r.why); d.setAttribute("data-l", "Why it's weaker");
          row.appendChild(a); row.appendChild(b); row.appendChild(d); tbody.appendChild(row);
        });
        tbl.appendChild(tbody); dp.appendChild(tbl); box.appendChild(dp);
      }
    }

    /* more + rubric */
    more.appendChild(el("p", "eyebrow", c ? "More teardowns" : "All teardowns"));
    items.filter(function (x) { return x.id !== id; }).forEach(function (x) {
      var a = el("a", null, (x.product || x.title) + " →"); a.href = "?t=" + encodeURIComponent(x.id); more.appendChild(a);
    });
    var ru = el("a", null, "How to read these (and how I'd grade one) →"); ru.href = "rubric.html"; more.appendChild(ru);
  });
})();
</script>
</body>
</html>
